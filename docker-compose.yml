services:
  db:
    image: postgres:16-alpine
    container_name: polyos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polykatoikiaos
    ports:
      - "5432:5432"
    volumes:
      - polyos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  polyos_pgdata:
